services:
  db:
    image: postgres:16-alpine
    container_name: clashbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clashbot
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - clashbot-db:/var/lib/postgresql/data
    networks:
      - interno
    mem_limit: 768m
    cpus: 0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clashbot"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bot:
    build: .
    container_name: clashbot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Rome
    volumes:
      - clashbot-keys:/keys
      - clashbot-locales:/locales
      - /opt/clashbot-backups/metrics:/metrics:ro
      - /opt/clashbot-backups/backup.log:/backup/backup.log:ro
      - /opt/clashbot-backups/restore.log:/backup/restore.log:ro
    networks:
      - interno
      - default
    mem_reservation: 256m
    mem_limit: 1750m
    cpus: 0.6
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build: .
    container_name: clashbot-web
    command: ["web"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started
    environment:
      TZ: Europe/Rome
    volumes:
      - clashbot-keys:/keys:ro
      - clashbot-locales:/locales:ro
    networks:
      - interno
    mem_limit: 768m
    cpus: 0.4
    healthcheck:
      test: ["CMD", "python", "-m", "clashbot", "health", "--web"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: clashbot-tunnel
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/keys/tunnel.token"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    volumes:
      - clashbot-keys:/keys:ro
    networks:
      - interno
      - default
    mem_limit: 128m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  interno:
    internal: true

volumes:
  clashbot-db:
  clashbot-keys:
  clashbot-locales:
